name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # No install step: the plugin has no runtime or dev dependencies and only
      # uses node: builtins. lib/ is committed because users install the
      # prebuilt package, so a build that disagrees with lib/ means someone
      # edited src/ without rebuilding.
      - name: Build lib/ from src/
        run: node scripts/build.mjs

      - name: lib/ matches src/
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            git status --porcelain -- lib
            echo "::error::lib/ is out of date - run npm run build and commit the result"
            exit 1
          fi

      # Tests that need ffmpeg skip themselves when it is missing (the Windows
      # runner does not ship one), so the same suite is green on both OSes.
      - name: Unit tests
        run: node --test test/*.test.mjs
